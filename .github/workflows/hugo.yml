# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Every 6 hours: the alert banner shows the last 72h of CERT bulletins.
    # 06:00 is its own entry so the inactivity reminder can key on it (once a day).
    - cron: "0 6 * * *"
    - cron: "0 0,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch security advisories and CERT alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fetch-advisories.mjs
      - name: Check repo inactivity
        id: inactivity
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "Days since last commit: $DAYS"
      - name: Send inactivity reminder
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' && steps.inactivity.outputs.days > 30 && steps.inactivity.outputs.days < 33 && env.MAIL_SERVER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "smzstudio.it · cron a rischio, fai un commit"
          to: ${{ secrets.MAIL_TO }}
          from: smzstudio bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Il repository savez/personalSite è inattivo da ${{ steps.inactivity.outputs.days }} giorni.
            GitHub disabilita i workflow schedulati dopo 60 giorni di inattività.
            Fai un commit qualsiasi entro i prossimi giorni per tenere vivo l'aggiornamento giornaliero delle advisory (questo è un promemoria singolo, non verrà ripetuto ogni giorno).
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
